# Cấu hình Postgres cho khối lượng làm việc của quydinhphapluat.vn:
# nhiều truy vấn toàn văn + vector trên máy 8 vCPU / 32 GB RAM.
listen_addresses = '*'
max_connections = 200

shared_buffers = 8GB
effective_cache_size = 24GB
work_mem = 32MB                 # nâng cho truy vấn HNSW và ts_rank
maintenance_work_mem = 2GB      # tăng tốc CREATE INDEX
random_page_cost = 1.1          # NVMe

# Ghi log để phục vụ giám sát (ke-hoach/11 §4)
logging_collector = on
log_min_duration_statement = 500ms
log_checkpoints = on
log_lock_waits = on
log_line_prefix = '%m [%p] %u@%d '

# Sao lưu liên tục (WAL archiving) — bật khi đã cấu hình nơi lưu trữ
wal_level = replica
archive_mode = on
archive_command = 'test ! -f /backup/wal/%f && cp %p /backup/wal/%f'
max_wal_size = 4GB
checkpoint_completion_target = 0.9

# pgvector
max_parallel_workers_per_gather = 4
