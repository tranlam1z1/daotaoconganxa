[project]
name = "docproc"
version = "0.1.0"
description = "Dịch vụ chuyển đổi tài liệu (OCR + AI) cho quydinhphapluat.vn"
requires-python = ">=3.12"
dependencies = [
  "pymupdf>=1.24",
  "pypdf>=4.0",
  "python-docx>=1.1",
  "pillow>=10.0",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "psycopg[binary]>=3.1",
  "httpx>=0.27",
  "anthropic>=1.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Chỉ cài khi máy có GPU và đủ đĩa — xem README.
heavy = ["docling", "marker-pdf", "paddlepaddle", "paddleocr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
markers = [
  "integration: cần dịch vụ ngoài (Postgres, Tesseract)",
]
filterwarnings = ["ignore::DeprecationWarning"]
