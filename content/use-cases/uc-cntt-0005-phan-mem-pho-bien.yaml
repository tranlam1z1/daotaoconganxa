risks:
  - risk: Không tra danh mục phần mềm phổ biến trước khi lập hồ sơ
    consequence: >-
      Lập cả bộ hồ sơ theo trình tự phần mềm nội bộ trong khi có con đường ngắn hơn; bị cơ quan thẩm
      định yêu cầu giải trình hoặc lập lại hồ sơ, mất nhiều tháng
    mitigation: Đưa bước tra danh mục thành bước bắt buộc đầu tiên; lưu phiếu tra cứu vào hồ sơ
    citations: [vn:vbqppl:nd:45/2026/NĐ-CP#dieu-5@2026-03-01]
  - risk: Chỉ tra danh mục quốc gia mà bỏ qua danh mục ngành
    consequence: Bỏ sót phần mềm phổ biến phù hợp nhất, vì phần mềm chuyên ngành thường nằm ở danh mục của bộ quản lý ngành
    mitigation: Tra cả hai cấp danh mục theo khoản 2 Điều 5
    citations: [vn:vbqppl:nd:45/2026/NĐ-CP#dieu-5.khoan-2@2026-03-01]
  - risk: >-
      Tách phần sửa đổi, bổ sung 15% ra thành một dự án phần mềm nội bộ riêng để đi theo trình tự phần
      mềm nội bộ
    consequence: Trái với khoản 4 Điều 5, làm phức tạp hồ sơ và kéo dài thời gian không cần thiết
    mitigation: Áp dụng đúng khoản 4 Điều 5, coi phần sửa đổi, bổ sung là một phần của phần mềm phổ biến
    citations: [vn:vbqppl:nd:45/2026/NĐ-CP#dieu-5.khoan-4@2026-03-01]
  - risk: >-
      Mức độ thay đổi vượt xa phạm vi "sửa đổi, bổ sung một số chức năng, tính năng, hiệu năng", thực
      chất là xây dựng phần mềm mới
    consequence: Áp dụng sai trình tự; bị kết luận là lách quy định khi kiểm tra
    mitigation: >-
      Lượng hóa mức độ thay đổi bằng bảng đối chiếu chức năng; nếu phần thay đổi chiếm tỷ trọng lớn
      thì lập theo trình tự phần mềm nội bộ và ghi rõ lập luận
    citations: [vn:vbqppl:nd:45/2026/NĐ-CP#dieu-5.khoan-4@2026-03-01]

