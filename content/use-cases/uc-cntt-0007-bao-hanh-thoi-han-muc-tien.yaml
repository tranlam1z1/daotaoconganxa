risks:
  - risk: Ghép nhầm cặp thời hạn và mức tiền bảo hành, ghi 12 tháng kèm 03%
    consequence: Mức bảo đảm thấp hơn quy định; khi có lỗi phát sinh thì tiền bảo hành không đủ để khắc phục
    mitigation: "Ghi nhớ quan hệ ngược chiều: thời hạn dài thì mức tiền thấp; kiểm tra chéo trước khi phát hành hồ sơ mời thầu"
    citations: [vn:vbqppl:nd:45/2026/NĐ-CP#dieu-26.khoan-2@2026-03-01]
  - risk: Áp dụng quy định bảo hành cho gói thuê dịch vụ công nghệ thông tin
    consequence: Điều khoản không có căn cứ, nhà thầu có cơ sở từ chối; tranh chấp hợp đồng
    mitigation: Với dự án thuê dịch vụ, dùng cơ chế yêu cầu chất lượng dịch vụ và giám sát chất lượng dịch vụ
    citations:
      - vn:vbqppl:nd:45/2026/NĐ-CP#dieu-26.khoan-4@2026-03-01
      - vn:vbqppl:nd:45/2026/NĐ-CP#dieu-23.khoan-3@2026-03-01
  - risk: Không nêu rõ hình thức bảo đảm được chấp nhận trong hồ sơ mời thầu
    consequence: Nhà thầu nộp hình thức chủ đầu tư không chấp nhận; chậm nghiệm thu bàn giao
    mitigation: Liệt kê cụ thể hình thức được chấp nhận ngay trong hồ sơ mời thầu
    citations: [vn:vbqppl:nd:45/2026/NĐ-CP#dieu-26.khoan-2@2026-03-01]
  - risk: Không ghi mốc bắt đầu và kết thúc bảo hành vào biên bản nghiệm thu
    consequence: Tranh chấp về thời điểm hết bảo hành và thời điểm hoàn trả tiền bảo hành
    mitigation: Đưa mục bảo hành thành mục bắt buộc của biên bản nghiệm thu
    citations: [vn:vbqppl:nd:45/2026/NĐ-CP#dieu-24@2026-03-01]

