<!doctype html>
<!--
  Trang dự phòng khi mất mạng (docs/PLAN.md GĐ13). Service worker (sw.js) trả trang này cho mọi
  trang cần mạng, ví dụ Thi và Hỏi đáp AI. Trang tĩnh, không chạy React: trang của ứng dụng cần
  dữ liệu máy chủ nên không dựng được khi mất mạng.
-->
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#A61C30" />
    <title>Cần có mạng | Học tập pháp luật</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg?v=5" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png?v=5" />
    <style>
      :root {
        color-scheme: light dark;
        --canvas: #f5f7fa;
        --surface: #ffffff;
        --ink: #243447;
        --ink-2: #526277;
        --line: #e2e8f0;
        --primary: #a61c30;
        --on-primary: #ffffff;
        --seal: #e03131;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --canvas: #0b1524;
          --surface: #121e33;
          --ink: #e9f0fa;
          --ink-2: #b7c6dc;
          --line: #22334f;
          --primary: #ff9eac;
          --on-primary: #331019;
          --seal: #ff8787;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--canvas);
        color: var(--ink);
        font: 16px/1.6 "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      main { max-width: 34rem; margin: 0 auto; padding: 48px 16px; }
      .dau { display: block; width: 96px; height: 96px; }
      h1 { margin: 24px 0 8px; font-size: 28px; line-height: 1.25; }
      p { margin: 0 0 12px; color: var(--ink-2); }
      .nut {
        display: flex; align-items: center; justify-content: center; min-height: 48px; margin-top: 12px;
        padding: 0 16px; border-radius: 8px; font-weight: 600; text-decoration: none; font-size: 16px;
        border: 1px solid var(--line); background: var(--surface); color: var(--ink); width: 100%; cursor: pointer;
      }
      :focus-visible { outline: 3px solid var(--primary); outline-offset: 3px; }
      .nut.chinh { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
    </style>
  </head>
  <body>
    <main>
      <!-- Logo nhúng thẳng (bản gốc: logo.svg) để hiện được khi mất mạng mà không cần cache. -->
      <svg class="dau" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-label="Học tập pháp luật và bồi dưỡng nghiệp vụ"><defs><linearGradient id="brand-red" x2="0" y2="1"><stop stop-color="#C22A43"/><stop offset="1" stop-color="#A61C30"/></linearGradient><linearGradient id="brand-blue" x2="0" y2="1"><stop stop-color="#267798"/><stop offset="1" stop-color="#104866"/></linearGradient><linearGradient id="brand-gold" x2="0" y2="1"><stop stop-color="#E5C66B"/><stop offset="1" stop-color="#C89B22"/></linearGradient></defs><g fill="none" stroke="#D1AA36" stroke-width="1.5" opacity=".2"><circle cx="160" cy="142" r="78"/><circle cx="160" cy="142" r="84"/><circle cx="160" cy="142" r="94"/><circle cx="160" cy="142" r="100"/><circle cx="160" cy="142" r="118"/><circle cx="160" cy="142" r="124"/></g><path d="M12 184 L27 180 L38 239 C87 241 128 266 160 300 C119 273 72 258 22 258 Z" fill="url(#brand-blue)" fill-rule="nonzero"/><path d="M308 184 L293 180 L282 239 C233 241 192 266 160 300 C201 273 248 258 298 258 Z" fill="url(#brand-blue)" fill-rule="nonzero"/><path d="M35 157 L51 155 L62 219 C101 230 134 254 158 291 C123 255 86 238 47 232 Z" fill="url(#brand-blue)" fill-rule="nonzero"/><path d="M285 157 L269 155 L258 219 C219 230 186 254 162 291 C197 255 234 238 273 232 Z" fill="url(#brand-blue)" fill-rule="nonzero"/><path d="M62 130 C103 131 138 151 154 181 L158 276 C135 229 107 204 74 193 Z" fill="url(#brand-red)" fill-rule="nonzero"/><path d="M258 130 C217 131 182 151 166 181 L162 276 C185 229 213 204 246 193 Z" fill="url(#brand-red)" fill-rule="nonzero"/><path d="M160 88 C153 105 138 118 141 132 C143 143 154 149 160 172 C166 149 177 143 179 132 C182 118 167 105 160 88 Z M160 119 A4 4 0 1 0 160 127 A4 4 0 1 0 160 119 Z M158.5 127 H161.5 V160 H158.5 Z" fill="url(#brand-gold)" fill-rule="evenodd"/><path d="M160.00 3.00 L170.58 34.44 L203.75 34.79 L177.12 54.56 L187.04 86.21 L160.00 67.00 L132.96 86.21 L142.88 54.56 L116.25 34.79 L149.42 34.44 Z" fill="url(#brand-gold)" fill-rule="nonzero"/></svg>
      <h1>Cần có mạng</h1>
      <p>
        Trang này cần kết nối mạng, ví dụ thi sát hạch, hỏi đáp AI và tra cứu văn bản. Hãy kiểm tra Wi-Fi hoặc dữ
        liệu di động rồi thử lại.
      </p>
      <p>Trong lúc chờ, bạn vẫn luyện tập được các chủ đề đã tải về máy.</p>
      <a class="nut chinh" href="/luyen-tap/offline">Luyện tập không cần mạng</a>
      <button class="nut" type="button" onclick="location.reload()">Thử lại</button>
    </main>
    <script>
      // Có mạng lại thì tự mở lại trang người dùng định vào.
      window.addEventListener("online", () => location.reload());
    </script>
  </body>
</html>
