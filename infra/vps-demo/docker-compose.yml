# Bản demo hocluat.senow.tech trên VPS. Traefik (happyfinate-traefik-1) nhận HTTPS và cấp chứng chỉ.
# Dùng: docker compose --env-file .env up -d --build ; gieo dữ liệu: docker compose run --rm seed
name: hocluat

x-app: &app
  build:
    context: ../..
    dockerfile: infra/vps-demo/Dockerfile
  image: hocluat-app:latest
  env_file: .env
  restart: unless-stopped
  volumes: ["storage:/data"]

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: qdpl
      POSTGRES_PASSWORD: ${PGPASSWORD:?đặt PGPASSWORD trong .env}
      POSTGRES_DB: quydinhphapluat_demo
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qdpl -d quydinhphapluat_demo"]
      interval: 5s
      retries: 20
    restart: unless-stopped
    networks: [internal]

  api:
    <<: *app
    command: ["bun", "apps/api/src/index.ts"]
    environment:
      PORT: "3001"
      API_PORT: "3001"
    depends_on: { db: { condition: service_healthy } }
    healthcheck:
      test: ["CMD-SHELL", "bun -e \"fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [internal, proxy]
    labels:
      traefik.enable: "true"
      traefik.docker.network: happyfinate_proxy
      traefik.http.routers.hocluat-api.rule: Host(`${API_DOMAIN}`) || Host(`${API_DOMAIN_2}`)
      traefik.http.routers.hocluat-api.entrypoints: websecure
      traefik.http.routers.hocluat-api.tls.certresolver: le
      traefik.http.routers.hocluat-api.service: hocluat-api
      traefik.http.services.hocluat-api.loadbalancer.server.port: "3001"

  web:
    <<: *app
    working_dir: /app/apps/web
    command: ["bunx", "react-router-serve", "./build/server/index.js"]
    environment:
      PORT: "3000"
      WEB_PORT: "3000"
      API_URL: http://api:3001
    depends_on: { api: { condition: service_healthy } }
    networks: [internal, proxy]
    labels:
      traefik.enable: "true"
      traefik.docker.network: happyfinate_proxy
      traefik.http.routers.hocluat-web.rule: Host(`${WEB_DOMAIN}`) || Host(`${WEB_DOMAIN_2}`)
      traefik.http.routers.hocluat-web.entrypoints: websecure
      traefik.http.routers.hocluat-web.tls.certresolver: le
      traefik.http.routers.hocluat-web.service: hocluat-web
      traefik.http.middlewares.hocluat-compress.compress: "true"
      # Header bảo mật cho mọi phản hồi của web. SAMEORIGIN chứ không DENY: trang đọc văn bản và biểu mẫu
      # nhúng tệp PDF của chính trang này trong khung.
      traefik.http.middlewares.hocluat-headers.headers.stsSeconds: "31536000"
      traefik.http.middlewares.hocluat-headers.headers.contentTypeNosniff: "true"
      traefik.http.middlewares.hocluat-headers.headers.referrerPolicy: strict-origin-when-cross-origin
      traefik.http.middlewares.hocluat-headers.headers.customFrameOptionsValue: SAMEORIGIN
      traefik.http.routers.hocluat-web.middlewares: hocluat-compress,hocluat-headers
      traefik.http.services.hocluat-web.loadbalancer.server.port: "3000"

  # Việc chạy một lần: migration + gieo dữ liệu demo (cùng các bước của scripts/demo.ts).
  # Dùng chung mạng với db để CSDL nằm ở 127.0.0.1: các script demo chỉ chịu ghi vào CSDL trên máy.
  seed:
    <<: *app
    restart: "no"
    profiles: ["seed"]
    command: ["sh", "infra/vps-demo/seed.sh"]
    environment:
      DATABASE_URL: postgres://qdpl:${PGPASSWORD}@127.0.0.1:5432/quydinhphapluat_demo
      DATABASE_URL_DIRECT: postgres://qdpl:${PGPASSWORD}@127.0.0.1:5432/quydinhphapluat_demo
    network_mode: service:db
    depends_on: { db: { condition: service_healthy } }

volumes:
  pgdata:
  storage:

networks:
  internal:
  proxy:
    name: happyfinate_proxy
    external: true
