risks:
  - risk: Hồ sơ mời thầu và hợp đồng không nhắc tới nghĩa vụ bàn giao mã nguồn
    consequence: Tranh chấp ở khâu nghiệm thu; chậm đưa hệ thống vào sử dụng; khó bảo trì về sau
    mitigation: Đưa đủ danh mục tại điểm b khoản 1 Điều 24 vào hồ sơ mời thầu và hợp đồng ngay từ đầu
    citations: [vn:vbqppl:nd:45/2026/NĐ-CP#dieu-24.khoan-1@2026-03-01]
  - risk: Nghiệm thu và thanh toán hết khi chưa nhận đủ tài liệu và mã nguồn
    consequence: Mất công cụ ràng buộc; phụ thuộc hoàn toàn vào nhà thầu để bảo trì và nâng cấp về sau
    mitigation: Không ký biên bản nghiệm thu trọn vẹn khi chưa nhận đủ; dùng biên bản nghiệm thu có điều kiện
    citations: [vn:vbqppl:nd:45/2026/NĐ-CP#dieu-24@2026-03-01]
  - risk: Nhận mã nguồn nhưng không kiểm tra được tính đầy đủ và khả năng biên dịch
    consequence: Mã nguồn nhận được không dùng được; phát hiện muộn khi cần bảo trì
    mitigation: >-
      Quy định trong hồ sơ mời thầu việc bàn giao mã nguồn phải kèm nghiệm thu biên dịch thành công
      trên môi trường độc lập, có biên bản xác nhận
    citations: [vn:vbqppl:nd:45/2026/NĐ-CP#dieu-24.khoan-1@2026-03-01]
  - risk: Không xác định phạm vi quyền của chủ đầu tư đối với mã nguồn
    consequence: Có mã nguồn nhưng không được phép sửa đổi hoặc giao bên thứ ba bảo trì
    mitigation: Thỏa thuận rõ phạm vi quyền trong hợp đồng, dựa trên pháp luật về sở hữu trí tuệ
    citations: []

