risks:
  - risk: Tách dự án thành nhiều dự án nhỏ để mỗi dự án dưới 20 tỷ đồng, nhằm né thiết kế hai bước
    consequence: >-
      Bị công tác kiểm tra, thanh tra, kiểm toán kết luận là chia nhỏ dự án; có thể phải hủy kết quả
      lựa chọn nhà thầu, xuất toán và xử lý trách nhiệm tổ chức, cá nhân liên quan
    mitigation: >-
      Chỉ tách khi các cấu phần thực sự độc lập vận hành được và đã được ghi trong chủ trương đầu tư
      ngay từ đầu
    citations:
      - vn:vbqppl:nd:45/2026/NĐ-CP#dieu-7.khoan-5@2026-03-01
      - vn:vbqppl:nd:45/2026/NĐ-CP#dieu-36@2026-03-01

  - risk: >-
      Triển khai theo hướng thiết kế một bước khi tổng mức đầu tư vượt 20 tỷ đồng mà chưa có văn bản
      cho phép của cấp có thẩm quyền quyết định đầu tư
    consequence: Hồ sơ bị trả lại ở bước thẩm định, mất thời gian lập lại theo hướng hai bước
    mitigation: Xin văn bản cho phép trước khi bắt đầu lập hồ sơ, không làm song song
    citations:
      - vn:vbqppl:nd:45/2026/NĐ-CP#dieu-9.khoan-2.diem-b@2026-03-01

  - risk: >-
      Với thiết kế hai bước, thiết kế chi tiết được lập không phù hợp với thiết kế cơ sở đã phê duyệt
    consequence: Phải điều chỉnh thiết kế, kéo dài tiến độ, có thể phải điều chỉnh dự án
    mitigation: >-
      Đưa yêu cầu về sự phù hợp với thiết kế cơ sở vào hồ sơ mời thầu và vào nhiệm vụ giám sát tác giả
    citations:
      - vn:vbqppl:nd:45/2026/NĐ-CP#dieu-9.khoan-4@2026-03-01
      - vn:vbqppl:nd:45/2026/NĐ-CP#dieu-9.khoan-5@2026-03-01

  - risk: >-
      Xác định tổng mức đầu tư thiếu khoản mục, làm con số nằm dưới ngưỡng 20 tỷ đồng một cách không
      thực chất
    consequence: >-
      Khi bổ sung đủ khoản mục, dự án vượt ngưỡng và phải làm lại theo hướng hai bước; đồng thời có
      nguy cơ phải điều chỉnh dự án
    mitigation: >-
      Rà đủ các khoản mục tại khoản 2 Điều 16, đặc biệt là chi phí tạo lập cơ sở dữ liệu, chi phí đào
      tạo và chi phí triển khai, hỗ trợ, quản trị, vận hành trước khi nghiệm thu bàn giao toàn bộ
    citations:
      - vn:vbqppl:nd:45/2026/NĐ-CP#dieu-16.khoan-2@2026-03-01

