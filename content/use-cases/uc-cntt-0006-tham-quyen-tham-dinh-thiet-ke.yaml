risks:
  - risk: Sở tự thẩm định thiết kế của dự án do chính Sở làm chủ đầu tư
    consequence: Vi phạm điểm c khoản 3 Điều 17; báo cáo thẩm định không hợp lệ, có thể phải thẩm định lại toàn bộ
    mitigation: Báo cáo Chủ tịch Ủy ban nhân dân tỉnh ngay từ đầu để có văn bản giao đơn vị khác hoặc lập hội đồng
    citations: [vn:vbqppl:nd:45/2026/NĐ-CP#dieu-17.khoan-3@2026-03-01]
  - risk: Hiểu nhầm thời hạn thẩm định thiết kế là cộng thêm ngoài thời hạn thẩm định dự án
    consequence: Lập kế hoạch tiến độ sai, chậm các mốc tiếp theo
    mitigation: Thời hạn thẩm định thiết kế nằm trong tổng thời hạn thẩm định dự án
    citations: [vn:vbqppl:nd:45/2026/NĐ-CP#dieu-17.khoan-5@2026-03-01]
  - risk: Nộp hồ sơ chưa đủ, làm mốc tính thời hạn chưa bắt đầu
    consequence: Kéo dài thực tế dù thời hạn quy định ngắn
    mitigation: Rà theo danh mục hồ sơ tại khoản 6 Điều 17 trước khi nộp; nộp bằng hình thức điện tử
    citations: [vn:vbqppl:nd:45/2026/NĐ-CP#dieu-17.khoan-6@2026-03-01]
  - risk: Xác định sai nhóm dự án, dẫn tới áp dụng sai mốc thời hạn
    consequence: Sai kế hoạch tiến độ và sai thẩm quyền
    mitigation: Đối chiếu tổng mức đầu tư với Điều 9, Điều 10, Điều 11 Luật Đầu tư công số 58/2024/QH15
    citations: [vn:vbqppl:l:58/2024/QH15#dieu-11.khoan-4@2025-01-01]

