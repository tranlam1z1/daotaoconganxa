risks:
  - risk: Xếp nhầm thành dự án mua sắm để bỏ qua bước thiết kế
    consequence: Hồ sơ bị trả lại; nếu đã triển khai thì thiếu căn cứ nghiệm thu vì không có thiết kế chi tiết được phê duyệt
    mitigation: Đối chiếu từng cấu phần với khoản 5 Điều 3 trước khi kết luận; ghi rõ lập luận trong hồ sơ
    citations:
      - vn:vbqppl:nd:45/2026/NĐ-CP#dieu-7.khoan-1@2026-03-01
  - risk: Nhầm quy tắc tại khoản 13 Điều 3 thành quy tắc phân loại dự án
    consequence: Kết luận sai loại dự án, kéo theo sai toàn bộ trình tự
    mitigation: "Phân biệt rõ hai tầng: xếp loại chi phí và mẫu hồ sơ mời thầu là một chuyện, phân loại dự án là chuyện khác"
    citations:
      - vn:vbqppl:nd:45/2026/NĐ-CP#dieu-3@2026-03-01
      - vn:vbqppl:nd:45/2026/NĐ-CP#dieu-7.khoan-1@2026-03-01
  - risk: Không tra danh mục phần mềm phổ biến trước khi quyết định xây dựng phần mềm nội bộ
    consequence: Bỏ lỡ con đường ngắn hơn theo trình tự phần mềm thương mại; tốn thời gian và chi phí không cần thiết
    mitigation: Tra danh mục quốc gia và danh mục ngành ngay ở bước hình thành ý tưởng, lưu kết quả vào hồ sơ
    citations:
      - vn:vbqppl:nd:45/2026/NĐ-CP#dieu-5.khoan-4@2026-03-01

