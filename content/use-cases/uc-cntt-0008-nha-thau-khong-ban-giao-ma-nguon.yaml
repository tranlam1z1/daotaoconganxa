slug: uc-cntt-0008-nha-thau-khong-ban-giao-ma-nguon
title: Xử lý khi nhà thầu không bàn giao mã nguồn của phần mềm nội bộ khi nghiệm thu

taxonomy_codes: [PD.03.003, PD.34.007, NB.CNTT.DTUD.NT, NB.CNTT.PM.NB]
actor_kinds: [co_quan_nha_nuoc, nha_thau]
work_kinds: [hop_dong, tranh_chap, nghia_vu_tuan_thu]

as_of: 2026-06-01
effectivity_note: >-
  Gán nhãn tại 01/6/2026. Từ 01/7/2026, quy định tương ứng nằm tại điểm b khoản 1 Điều 57 Nghị định
  số 224/2026/NĐ-CP, giữ nguyên yêu cầu bàn giao mã nguồn của chương trình.

situation: |
  Một sở chuyên môn của tỉnh T đã hoàn thành vận hành thử một hệ thống thông tin có hạng mục phần mềm
  nội bộ và chuẩn bị nghiệm thu. Khi lập biên bản bàn giao, nhà thầu triển khai chỉ bàn giao bộ
  chương trình cài đặt, tài liệu hướng dẫn sử dụng và tài liệu đào tạo. Nhà thầu từ chối bàn giao mã
  nguồn với lý do mã nguồn là tài sản trí tuệ của doanh nghiệp và hợp đồng không nêu rõ nghĩa vụ này.
  Sở hỏi có căn cứ buộc nhà thầu bàn giao mã nguồn hay không, và nếu vẫn không bàn giao thì xử lý thế
  nào.

questions:
  - Nhà thầu có nghĩa vụ bàn giao mã nguồn của phần mềm nội bộ hay không?
  - Danh mục sản phẩm và tài liệu phải bàn giao gồm những gì?
  - Nếu hợp đồng không nêu rõ thì có buộc được nhà thầu không?
  - Chưa có mã nguồn thì có được nghiệm thu không?

analysis:
  - step: 1
    claim: >-
      Nhà thầu có nghĩa vụ bàn giao mã nguồn của chương trình khi bàn giao phần mềm nội bộ; đây là
      nghĩa vụ do văn bản quy phạm pháp luật đặt ra, không phụ thuộc vào việc hợp đồng có nhắc tới hay
      không.
    citations:
      - vn:vbqppl:nd:45/2026/NĐ-CP#dieu-24.khoan-1@2026-03-01
    quote: >-
      Đối với xây dựng, phát triển hoặc nâng cấp, mở rộng phần mềm nội bộ, nhà thầu phải bàn giao: các
      tài liệu, thiết kế chi tiết của từng giai đoạn trong quá trình xây dựng, phát triển hoặc nâng
      cấp, mở rộng phần mềm theo nội dung hợp đồng đã ký kết; bộ chương trình cài đặt phần mềm (nếu
      có); mã nguồn của chương trình; các tài liệu hướng dẫn cài đặt, sử dụng, quản trị, vận hành;
      tài liệu phục vụ đào tạo người sử dụng, quản trị, vận hành; tài liệu quy trình, điều kiện, nội
      dung công việc bảo trì.
    reasoning: >-
      Điểm b khoản 1 Điều 24 dùng từ "phải bàn giao" và liệt kê "mã nguồn của chương trình" là một mục
      độc lập trong danh mục. Đây là quy phạm bắt buộc. Lập luận của nhà thầu rằng hợp đồng không nêu
      rõ không loại trừ nghĩa vụ luật định: hợp đồng không thể thỏa thuận trái quy định của pháp luật.

  - step: 2
    claim: >-
      Nhà thầu mới bàn giao 3 trong 6 nhóm nội dung bắt buộc, còn thiếu mã nguồn, tài liệu thiết kế
      chi tiết của từng giai đoạn, tài liệu hướng dẫn cài đặt, quản trị, vận hành và tài liệu bảo trì.
    citations:
      - vn:vbqppl:nd:45/2026/NĐ-CP#dieu-24.khoan-1@2026-03-01
    quote: ""
    reasoning: >-
      Đối chiếu danh mục tại điểm b khoản 1 Điều 24 với thực tế bàn giao: đã có bộ chương trình cài
      đặt, tài liệu hướng dẫn sử dụng và tài liệu đào tạo. Còn thiếu: mã nguồn; tài liệu thiết kế chi
      tiết của từng giai đoạn; tài liệu hướng dẫn cài đặt, quản trị, vận hành; tài liệu quy trình,
      điều kiện, nội dung công việc bảo trì. Vấn đề rộng hơn nhiều so với chỉ mã nguồn.

  - step: 3
    claim: >-
      Chưa bàn giao đủ danh mục bắt buộc thì chưa đủ điều kiện nghiệm thu, bàn giao sản phẩm.
    citations:
      - vn:vbqppl:nd:45/2026/NĐ-CP#dieu-24@2026-03-01
      - vn:vbqppl:nd:45/2026/NĐ-CP#dieu-25@2026-03-01
    quote: ""
    reasoning: >-
      Điều 24 quy định việc nghiệm thu gắn liền với bàn giao sản phẩm và tài liệu; Điều 25 yêu cầu lập
      và lưu trữ hồ sơ hoàn thành dự án, mà hồ sơ hoàn thành không thể đủ nếu thiếu mã nguồn và tài
      liệu thiết kế. Chủ đầu tư có cơ sở để chưa ký biên bản nghiệm thu, hoặc ký biên bản nghiệm thu
      có điều kiện với thời hạn khắc phục rõ ràng.

  - step: 4
    claim: >-
      Tiền bảo hành là công cụ tài chính để bảo đảm nhà thầu thực hiện nghĩa vụ còn thiếu.
    citations:
      - vn:vbqppl:nd:45/2026/NĐ-CP#dieu-26.khoan-2@2026-03-01
    quote: Nhà thầu nộp thư bảo lãnh ngân hàng hoặc hình thức bảo lãnh khác được chấp nhận.
    reasoning: >-
      Vì tiền bảo hành chỉ được hoàn trả sau khi kết thúc thời hạn bảo hành và được xác nhận hoàn
      thành nghĩa vụ, chủ đầu tư có công cụ ràng buộc. Tuy vậy đây là biện pháp khắc phục hậu quả;
      cách xử lý gốc là đưa nghĩa vụ vào hồ sơ mời thầu và hợp đồng ngay từ đầu.

  - step: 5
    claim: >-
      Phạm vi quyền của chủ đầu tư đối với mã nguồn được bàn giao, gồm quyền sửa đổi và quyền giao cho
      bên thứ ba bảo trì, cần được xác định bằng thỏa thuận trong hợp đồng.
    citations: []
    quote: ""
    reasoning: >-
      Nghị định quy định nghĩa vụ **bàn giao** mã nguồn, nhưng phạm vi quyền sử dụng, quyền sửa đổi và
      quyền chuyển giao cho bên thứ ba thuộc phạm vi pháp luật về sở hữu trí tuệ và thỏa thuận hợp
      đồng. `[CẦN ĐỐI CHIẾU: quy định của pháp luật về sở hữu trí tuệ đối với chương trình máy tính
      được tạo ra theo hợp đồng đặt hàng bằng ngân sách nhà nước]`

conclusion: |
  Nhà thầu **có nghĩa vụ bàn giao mã nguồn của chương trình**. Đây là nghĩa vụ luật định tại điểm b
  khoản 1 Điều 24 Nghị định 45/2026/NĐ-CP, không phụ thuộc vào việc hợp đồng có nhắc tới hay không;
  hợp đồng không thể thỏa thuận trái quy định của pháp luật.

  Thực tế nhà thầu còn thiếu nhiều hơn mã nguồn: thiếu cả tài liệu thiết kế chi tiết của từng giai
  đoạn, tài liệu hướng dẫn cài đặt, quản trị, vận hành và tài liệu quy trình, điều kiện, nội dung
  công việc bảo trì.

  Chủ đầu tư nên xử lý theo ba bước: (1) có văn bản yêu cầu nhà thầu bàn giao đủ danh mục tại điểm b
  khoản 1 Điều 24, kèm trích dẫn nguyên văn; (2) nếu nhà thầu vẫn không thực hiện thì chưa ký biên
  bản nghiệm thu, hoặc ký biên bản nghiệm thu có điều kiện ghi rõ tồn tại và thời hạn khắc phục; (3)
  sử dụng cơ chế tiền bảo hành theo khoản 2 Điều 26 làm công cụ ràng buộc.

  Bài học phòng ngừa: đưa toàn bộ danh mục 6 nhóm nội dung tại điểm b khoản 1 Điều 24 vào **hồ sơ mời
  thầu** và vào **điều khoản hợp đồng**, kèm quy định về định dạng bàn giao mã nguồn, cách bàn giao
  và phạm vi quyền sử dụng.

