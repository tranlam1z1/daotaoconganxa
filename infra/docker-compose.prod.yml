# Triển khai sản xuất tối thiểu (một máy). Quy mô lớn hơn thì chuyển sang Kubernetes.
# Dùng: docker compose -f infra/docker-compose.prod.yml --env-file .env.prod up -d
name: quydinhphapluat-prod

x-bun-build: &bun-build
  build:
    context: ..
    dockerfile: infra/Dockerfile.bun
x-common-env: &common-env
  DATABASE_URL: ${DATABASE_URL}
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
  STORAGE_DIR: /data
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  LLM_PROVIDER: ${LLM_PROVIDER:-auto}
  EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-tei}
  EMBEDDING_URL: http://embeddings:80
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${PGUSER:-qdpl}
      POSTGRES_PASSWORD: ${PGPASSWORD:?bắt buộc đặt PGPASSWORD}
      POSTGRES_DB: ${PGDATABASE:-quydinhphapluat}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-qdpl}"]
      interval: 10s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "${REDIS_MAXMEMORY:-2gb}", "--maxmemory-policy", "noeviction", "--requirepass", "${REDIS_PASSWORD:?bắt buộc đặt REDIS_PASSWORD}"]
    volumes: ["redisdata:/data"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      retries: 5
    restart: unless-stopped

  # Worker nạp kho: chạy tách riêng để scale độc lập với API và web.
  ingest-worker:
    <<: *bun-build
    build: { args: { APP: worker } }
    environment:
      <<: *common-env
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      QDPL_WORKER_MODE: bull
    volumes: ["storage:/data"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped
    deploy: { replicas: 2 }

  api:
    <<: *bun-build
    build: { args: { APP: api } }
    environment: { <<: *common-env, PORT: "3001" }
    volumes: ["storage:/data"]
    depends_on: { postgres: { condition: service_healthy } }
    restart: unless-stopped
    deploy: { replicas: 2 }

  web:
    <<: *bun-build
    build: { args: { APP: web } }
    environment: { <<: *common-env, PORT: "3000", API_URL: "http://api:3001" }
    depends_on: [api]
    ports: ["3000:3000"]
    restart: unless-stopped

  worker:
    <<: *bun-build
    build: { args: { APP: worker } }
    environment: *common-env
    volumes: ["storage:/data"]
    depends_on: { postgres: { condition: service_healthy } }
    restart: unless-stopped

  docproc:
    build:
      context: ..
      dockerfile: infra/Dockerfile.docproc
      args: { WITH_OCR: "1" }
    environment: *common-env
    volumes: ["storage:/data"]
    depends_on: { postgres: { condition: service_healthy } }
    restart: unless-stopped

  embeddings:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.6
    command: ["--model-id", "BAAI/bge-m3", "--max-batch-tokens", "16384"]
    volumes: ["models:/data"]
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  storage:
  models:
