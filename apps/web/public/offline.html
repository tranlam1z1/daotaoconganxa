<!doctype html>
<!--
  Trang dự phòng khi mất mạng (docs/PLAN.md GĐ13). Service worker (sw.js) trả trang này cho mọi
  trang cần mạng, ví dụ Thi và Hỏi đáp AI. Trang tĩnh, không chạy React: trang của ứng dụng cần
  dữ liệu máy chủ nên không dựng được khi mất mạng.
-->
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1B4D3E" />
    <title>Cần có mạng | Đào tạo Công an xã</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg?v=6" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png?v=6" />
    <style>
      :root {
        color-scheme: light dark;
        --canvas: #dfe6f6;
        --surface: #f7f9ff;
        --ink: #131c2e;
        --ink-2: #526277;
        --line: #ccd6ec;
        --primary: #1b4d3e;
        --on-primary: #ffffff;
        --seal: #da251d;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --canvas: #0b1524;
          --surface: #121e33;
          --ink: #e9f0fa;
          --ink-2: #b7c6dc;
          --line: #22334f;
          --primary: #8fd4b5;
          --on-primary: #00261b;
          --seal: #ff8787;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--canvas);
        color: var(--ink);
        font: 16px/1.6 "Public Sans", "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      main { max-width: 34rem; margin: 0 auto; padding: 48px 16px; }
      .dau { display: block; width: 96px; height: 96px; }
      h1 { margin: 24px 0 8px; font-size: 28px; line-height: 1.25; }
      p { margin: 0 0 12px; color: var(--ink-2); }
      .nut {
        display: flex; align-items: center; justify-content: center; min-height: 48px; margin-top: 12px;
        padding: 0 16px; border-radius: 8px; font-weight: 600; text-decoration: none; font-size: 16px;
        border: 1px solid var(--line); background: var(--surface); color: var(--ink); width: 100%; cursor: pointer;
      }
      :focus-visible { outline: 3px solid var(--primary); outline-offset: 3px; }
      .nut.chinh { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
    </style>
  </head>
  <body>
    <main>
      <!-- Logo nhúng thẳng (bản gốc: logo.svg) để hiện được khi mất mạng mà không cần cache. -->
      <svg class="dau" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-label="Đào tạo nghiệp vụ Công an xã"><path d="M160 10 C205 10 250 18 278 30 C287 34 290 40 290 50 L290 150 C290 225 235 280 168 308 C163 310 157 310 152 308 C85 280 30 225 30 150 L30 50 C30 40 33 34 42 30 C70 18 115 10 160 10 Z" fill="#1B4D3E"/><path d="M158 52 Q160 50 162 52 L190 80 Q192 82 190 84 L162 112 Q160 114 158 112 L130 84 Q128 82 130 80 Z" fill="#D4AF37"/><path d="M68 130 Q68 127 71 127 L153 127 Q155 127 155 129 L155 256 C134 236 104 229 71 229 Q68 229 68 226 Z" fill="#FFF9EE"/><path d="M252 130 Q252 127 249 127 L167 127 Q165 127 165 129 L165 256 C186 236 216 229 249 229 Q252 229 252 226 Z" fill="#FFF9EE"/></svg>
      <h1>Cần có mạng</h1>
      <p>
        Trang này cần kết nối mạng, ví dụ thi sát hạch, hỏi đáp AI và tra cứu văn bản. Hãy kiểm tra Wi-Fi hoặc dữ
        liệu di động rồi thử lại.
      </p>
      <p>Trong lúc chờ, bạn vẫn luyện tập được các chủ đề đã tải về máy.</p>
      <a class="nut chinh" href="/luyen-tap/offline">Luyện tập không cần mạng</a>
      <button class="nut" type="button" onclick="location.reload()">Thử lại</button>
    </main>
    <script>
      // Có mạng lại thì tự mở lại trang người dùng định vào.
      window.addEventListener("online", () => location.reload());
    </script>
  </body>
</html>
