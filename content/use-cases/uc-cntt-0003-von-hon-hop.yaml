risks:
  - risk: Hiểu hai điều kiện là điều kiện đồng thời
    consequence: Kết luận sai rằng dự án không thuộc phạm vi; toàn bộ hồ sơ lập sai trình tự và bị trả lại
    mitigation: Đọc kỹ liên từ "hoặc" trong khoản 2 Điều 1; ghi rõ phép tính vào hồ sơ
    citations: [vn:vbqppl:nd:45/2026/NĐ-CP#dieu-1.khoan-2@2026-03-01]
  - risk: Cơ cấu vốn thay đổi giữa chừng mà không tính lại tỷ lệ
    consequence: Dự án đang ngoài phạm vi bỗng rơi vào phạm vi hoặc ngược lại, phát hiện muộn ở bước thẩm định
    mitigation: Đặt điểm kiểm tra bắt buộc mỗi khi điều chỉnh cơ cấu vốn
    citations: [vn:vbqppl:nd:45/2026/NĐ-CP#dieu-1.khoan-2@2026-03-01]
  - risk: Chọn lọc áp dụng một phần nghị định khi thuộc diện khuyến khích
    consequence: Hồ sơ không nhất quán, khó giải trình khi kiểm tra
    mitigation: Nếu đã chọn áp dụng thì áp dụng toàn bộ và ghi rõ quyết định này bằng văn bản
    citations: [vn:vbqppl:nd:45/2026/NĐ-CP#dieu-2.khoan-2@2026-03-01]

