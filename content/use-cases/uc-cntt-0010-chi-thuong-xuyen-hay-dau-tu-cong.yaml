risks:
  - risk: Chọn nguồn vốn theo mong muốn về thủ tục thay vì theo bản chất hoạt động
    consequence: Bị kết luận sử dụng sai nguồn kinh phí; xuất toán và xử lý trách nhiệm
    mitigation: Xác định bản chất hoạt động trước, rồi mới xác định nguồn vốn; ghi rõ lập luận vào hồ sơ
    citations: [vn:vbqppl:nd:45/2026/NĐ-CP#dieu-36@2026-03-01]
  - risk: Dùng khung nội dung báo cáo nghiên cứu khả thi của Điều 12 cho dự án dùng kinh phí chi thường xuyên
    consequence: Thiếu nội dung theo khoản 4 Điều 33; hồ sơ bị trả lại
    mitigation: Đối chiếu đủ 13 điểm tại khoản 4 Điều 33 khi dự án dùng kinh phí chi thường xuyên
    citations: [vn:vbqppl:nd:45/2026/NĐ-CP#dieu-33.khoan-4@2026-03-01]
  - risk: Nhầm dịch vụ sẵn có với dịch vụ không sẵn có trên thị trường
    consequence: Áp dụng thừa hoặc thiếu trình tự tại Điều 34
    mitigation: Đối chiếu với định nghĩa tại khoản 2 và khoản 3 Điều 3 trước khi kết luận
    citations: [vn:vbqppl:nd:45/2026/NĐ-CP#dieu-3@2026-03-01]
  - risk: Gộp nhiều nhu cầu khác bản chất vào một hồ sơ để đơn giản hóa thủ tục
    consequence: Hồ sơ không xác định được chế độ áp dụng; bị trả lại toàn bộ
    mitigation: Tách theo bản chất hoạt động và theo nguồn vốn, mỗi nhóm một lối đi pháp lý
    citations: [vn:vbqppl:nd:45/2026/NĐ-CP#dieu-7.khoan-1@2026-03-01]

