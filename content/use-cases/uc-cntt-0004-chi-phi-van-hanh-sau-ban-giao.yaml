risks:
  - risk: Đưa chi phí vận hành sau bàn giao vào tổng mức đầu tư
    consequence: Bị loại ở bước thẩm định; nếu lọt qua thì bị xuất toán khi quyết toán hoặc kiểm toán
    mitigation: Áp dụng mốc nghiệm thu bàn giao toàn bộ làm ranh giới, rà từng khoản chi
    citations: [vn:vbqppl:nd:45/2026/NĐ-CP#dieu-27.khoan-3@2026-03-01]
  - risk: Bỏ sót khoản chi phí triển khai, hỗ trợ, vận hành trước khi nghiệm thu bàn giao
    consequence: Thiếu kinh phí cho giai đoạn chạy thử; nhà thầu không có nghĩa vụ hỗ trợ, hệ thống chậm đưa vào sử dụng
    mitigation: Đưa khoản mục này vào ngay từ dự thảo tổng mức đầu tư, ước lượng theo độ dài giai đoạn vận hành thử
    citations: [vn:vbqppl:nd:45/2026/NĐ-CP#dieu-16.khoan-2@2026-03-01]
  - risk: Không bố trí được kinh phí chi thường xuyên cho vận hành sau khi bàn giao
    consequence: Hệ thống xuống cấp, dừng hoạt động sau vài tháng, lãng phí toàn bộ vốn đầu tư
    mitigation: Cam kết bố trí kinh phí ngay trong báo cáo nghiên cứu khả thi và trong quyết định đầu tư
    citations: [vn:vbqppl:nd:45/2026/NĐ-CP#dieu-27.khoan-3@2026-03-01]
  - risk: Chi trùng giữa bảo trì theo hợp đồng dịch vụ và bảo hành theo nghĩa vụ của nhà thầu
    consequence: Chi sai, bị xuất toán phần chi trùng
    mitigation: Xác định rõ ranh giới phạm vi bảo hành trong hợp đồng; dự toán bảo trì năm đầu trừ phần thuộc bảo hành
    citations: [vn:vbqppl:nd:45/2026/NĐ-CP#dieu-26@2026-03-01]

