risks:
  - risk: Hiểu nhầm rằng mọi dự án đang dở dang đều tự động chuyển sang Nghị định số 224/2026/NĐ-CP
    consequence: Lập lại hồ sơ không cần thiết, chậm tiến độ nhiều tháng
    mitigation: "Đọc kỹ khoản 2 Điều 91: hai mốc chuyển tiếp là điều kiện thay thế nhau"
    citations: [vn:vbqppl:nd:224/2026/NĐ-CP#dieu-91.khoan-2@2026-07-01]
  - risk: Chủ đầu tư tự quyết định chuyển sang nghị định mới mà không trình cấp có thẩm quyền
    consequence: Thiếu căn cứ pháp lý cho các bước sau; hồ sơ bị bác khi thẩm định hoặc khi kiểm tra
    mitigation: Xin văn bản quyết định của cấp có thẩm quyền quyết định đầu tư trước khi áp dụng
    citations: [vn:vbqppl:nd:224/2026/NĐ-CP#dieu-91.khoan-2@2026-07-01]
  - risk: Áp dụng xen kẽ hai nghị định cho các bước khác nhau
    consequence: >-
      Hồ sơ mâu thuẫn nội tại, đặc biệt ở khâu thẩm định và phê duyệt thiết kế chi tiết của dự án có
      phần mềm nội bộ; khó giải trình khi kiểm tra, thanh tra, kiểm toán
    mitigation: Chọn một chế độ áp dụng cho cả dự án và ghi rõ trong văn bản quyết định
    citations: [vn:vbqppl:nd:224/2026/NĐ-CP#dieu-91.khoan-2@2026-07-01]
  - risk: Sau khi chọn nghị định, vẫn viện dẫn số điều của nghị định kia trong hồ sơ
    consequence: Viện dẫn sai, hồ sơ bị trả lại để chỉnh sửa
    mitigation: Dùng bảng đối chiếu điều theo điều để rà toàn bộ viện dẫn; cập nhật bản đồ pháp lý của dự án
    citations: []

